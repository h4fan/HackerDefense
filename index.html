<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业网络攻防对抗 · SOC Defense</title>
<style>
:root{
  --bg:#080e1a; --panel:#0f1a2e; --panel2:#152541; --line:#1e3350;
  --txt:#e6edf6; --muted:#8098b8; --accent:#ffd166;
  --ok:#4cd964; --warn:#ff9f43; --bad:#ff4d6d;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow:hidden;user-select:none;}
#app{display:flex;flex-direction:column;height:100vh;}

/* ============ 顶部 HUD ============ */
header{display:flex;align-items:center;gap:14px;padding:8px 14px;
  background:linear-gradient(90deg,#0c1526,#122239);border-bottom:1px solid var(--line);
  flex:none;flex-wrap:wrap;}
.brand{font-size:15px;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
.brand .sub{font-size:10px;color:var(--muted);font-weight:400;margin-left:6px;}
.hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:4px 10px;font-size:11px;white-space:nowrap;}
.chip b{font-size:14px;color:var(--accent);}
.bar{width:130px;height:9px;background:#0a1424;border:1px solid var(--line);
  border-radius:6px;overflow:hidden;margin-top:3px;}
.bar i{display:block;height:100%;transition:width .18s;}
.hp .bar i{background:linear-gradient(90deg,#ff4d6d,#ff9f43);}
.ap .bar i{background:linear-gradient(90deg,#2bd9c9,#4cd964);}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.tools button{padding:5px 10px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);cursor:pointer;font-size:11px;transition:.15s;}
.tools button:hover{border-color:var(--accent);color:var(--accent);}
.tools button.on{background:var(--accent);color:#0b1220;border-color:var(--accent);}

/* ============ 主体 ============ */
main{flex:1;display:flex;min-height:0;}
#stage{flex:1;position:relative;overflow:hidden;
  background:radial-gradient(circle at 25% 12%,#101f38 0,#080e1a 62%);}
#stage.hurt{animation:hurt .32s;}
@keyframes hurt{0%{box-shadow:inset 0 0 0 0 rgba(255,77,109,0);}
  40%{box-shadow:inset 0 0 90px 12px rgba(255,77,109,.5);}100%{box-shadow:inset 0 0 0 0 rgba(255,77,109,0);}}
svg{width:100%;height:100%;display:block;cursor:crosshair;}
svg.grabbing{cursor:grabbing;}

.zone-band{fill:rgba(255,255,255,.014);stroke:var(--line);stroke-width:1;stroke-dasharray:5 7;}
.zone-label{fill:#6d87a8;font-size:12px;font-weight:700;letter-spacing:1px;}
.edge{stroke:#243a58;stroke-width:1.4;fill:none;}
.edge.live{stroke:#3f5c85;stroke-width:1.8;}

.node{cursor:pointer;}
.node-box{fill:var(--panel2);stroke-width:1.6;transition:fill .12s,stroke .12s;}
.node:hover .node-box{fill:#1c3055;}
.node-icon{font-size:23px;text-anchor:middle;dominant-baseline:central;}
.node-label{font-size:15px;font-weight:700;fill:var(--txt);dominant-baseline:central;}
.node-tag{font-size:10px;fill:#7f96b6;dominant-baseline:central;}
.node-badge{font-size:16px;text-anchor:middle;dominant-baseline:central;}
.node.valid .node-box{stroke-width:3.4;}
.node.valid{animation:pulseV 1.1s ease-in-out infinite;}
@keyframes pulseV{0%,100%{opacity:1;}50%{opacity:.62;}}
.node.locate .node-box{stroke:#fff;stroke-width:4;}

/* 攻击图层 */
.atk-path{stroke-width:2.4;fill:none;stroke-dasharray:8 7;opacity:.5;
  animation:dash 1.1s linear infinite;}
@keyframes dash{to{stroke-dashoffset:-15;}}
.atk-halo{opacity:.22;animation:halo 1.15s ease-in-out infinite;}
@keyframes halo{0%,100%{r:15;opacity:.28;}50%{r:24;opacity:.06;}}
.atk-dot{stroke:#fff;stroke-width:2;}
.atk-txt{font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central;
  fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3.5;}
.locate-ring{fill:none;stroke:#fff;stroke-width:3;}

/* 节点快捷操作面板 */
#nodePanel{position:absolute;z-index:24;width:302px;max-height:min(78vh,570px);
  overflow-y:auto;background:rgba(10,18,32,.985);border:1.5px solid var(--accent);
  border-radius:12px;padding:9px 10px 10px;box-shadow:0 12px 34px rgba(0,0,0,.72);
  display:none;pointer-events:auto;}
#nodePanel.show{display:block;animation:tin .18s;}
#nodePanel .nph{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;
  padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line);}
#nodePanel .nph .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:15px;
  line-height:1;padding:0 5px;border-radius:5px;}
#nodePanel .nph .x:hover{color:var(--bad);background:#2a1420;}
#nodePanel .nps{font-size:10.5px;color:var(--muted);margin-bottom:6px;line-height:1.5;}
#nodePanel .npl{font-size:10px;color:var(--muted);letter-spacing:.5px;margin:7px 0 5px;}
#nodePanel .npv{display:inline-block;font-size:10px;padding:2px 7px;border-radius:9px;
  margin:0 3px 4px 0;border:1px solid var(--warn);color:var(--warn);cursor:pointer;}
#nodePanel .npv:hover{background:rgba(255,159,67,.18);}
#nodePanel .npv.done{border-color:var(--ok);color:var(--ok);cursor:default;}
.npbtn{display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:5px 8px;margin-bottom:5px;cursor:pointer;color:var(--txt);transition:.12s;}
.npbtn:hover{border-color:var(--accent);background:#22365a;}
.npbtn.no{opacity:.4;cursor:not-allowed;}
.npbtn .i{font-size:16px;width:20px;text-align:center;flex:none;}
.npbtn .nm{font-size:11.5px;font-weight:700;flex:1;line-height:1.3;}
.npbtn .nm small{display:block;font-weight:400;font-size:9.5px;color:var(--muted);}
.npbtn .cost{font-size:10px;color:var(--accent);white-space:nowrap;}
.npbtn .tag{font-size:9px;padding:1px 5px;border-radius:7px;background:#0c1526;color:var(--ok);}
.npbtn.rec{border-color:rgba(76,217,100,.6);box-shadow:inset 0 0 0 1px rgba(76,217,100,.16);}

#tip{position:absolute;pointer-events:none;background:rgba(8,14,26,.97);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;
  line-height:1.55;max-width:250px;z-index:20;display:none;box-shadow:0 8px 26px rgba(0,0,0,.6);}
#tip .t{font-weight:700;font-size:13px;margin-bottom:3px;}
#tip .vk{color:var(--warn);}
#tip .vs{color:var(--ok);}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:25;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{background:rgba(12,22,40,.97);border:1px solid var(--line);border-radius:8px;
  padding:7px 15px;font-size:12.5px;animation:tin .25s;box-shadow:0 6px 20px rgba(0,0,0,.5);}
.toast.warn{border-color:var(--warn);color:var(--warn);}
.toast.ok{border-color:var(--ok);color:var(--ok);}
.toast.bad{border-color:var(--bad);color:var(--bad);}
@keyframes tin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
#phaseTag{position:absolute;top:12px;left:14px;z-index:15;font-size:12px;
  padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:rgba(12,22,40,.9);pointer-events:none;}
#phaseTag.prep{border-color:var(--ok);color:var(--ok);}
#phaseTag.wave{border-color:var(--bad);color:var(--bad);animation:pulseV 1.2s infinite;}

/* ============ 右侧栏 ============ */
aside{width:344px;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;}
.sec{border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.sec-h{padding:7px 12px;font-size:11px;font-weight:800;letter-spacing:1px;
  color:var(--muted);background:#0c1526;display:flex;align-items:center;gap:6px;flex:none;}
.sec-h .n{margin-left:auto;color:var(--accent);}
#devInfo{padding:9px 12px;font-size:12px;line-height:1.6;flex:none;min-height:78px;}
#devInfo .nm{font-size:13.5px;font-weight:700;margin-bottom:3px;}
#devInfo .mut{color:var(--muted);}
.vchip{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;
  margin:2px 3px 0 0;border:1px solid var(--warn);color:var(--warn);}
.vchip.ok{border-color:var(--ok);color:var(--ok);}

#threats{overflow-y:auto;padding:6px;flex:1;min-height:90px;}
.threat{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:8px;
  background:#0c1526;border:1px solid var(--line);margin-bottom:5px;cursor:pointer;
  transition:.12s;}
.threat:hover{border-color:var(--accent);background:#132340;}
.threat.hid{border-style:dashed;border-color:var(--warn);}
.th-ic{font-size:17px;flex:none;width:22px;text-align:center;}
.th-main{flex:1;min-width:0;}
.th-t{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;}
.th-t .ar{color:var(--muted);font-weight:400;}
.th-bar{height:5px;background:#08111f;border-radius:4px;overflow:hidden;margin-top:4px;}
.th-bar i{display:block;height:100%;width:0;}
.th-act{flex:none;background:#132340;border:1px solid var(--line);border-radius:7px;
  color:var(--txt);cursor:pointer;padding:3px 7px;font-size:11px;line-height:1.25;
  text-align:center;min-width:38px;}
.th-act:hover{border-color:var(--accent);color:var(--accent);}
.th-act b{display:block;font-size:9px;color:var(--muted);font-weight:400;}
#log{overflow-y:auto;padding:6px 10px;font-size:11.5px;line-height:1.5;
  flex:1;min-height:110px;}
#log div{padding:1.5px 0;border-bottom:1px solid rgba(255,255,255,.03);}
#log .ok{color:var(--ok);}#log .bad{color:var(--bad);}
#log .warn{color:var(--warn);}#log .info{color:var(--muted);}
.empty{color:var(--muted);font-size:11.5px;padding:8px;text-align:center;}

/* ============ 底部卡牌栏 ============ */
#cards{flex:none;display:flex;gap:7px;padding:8px 12px;background:#0c1526;
  border-top:1px solid var(--line);overflow-x:auto;align-items:stretch;}
.card{position:relative;flex:none;width:96px;background:var(--panel2);
  border:1.6px solid var(--line);border-radius:10px;padding:6px 4px 5px;cursor:pointer;
  text-align:center;overflow:hidden;transition:.13s;}
.card:hover{border-color:#3f5c85;transform:translateY(-2px);}
.card.armed{border-color:var(--accent);background:#22365a;transform:translateY(-3px);
  box-shadow:0 0 0 2px rgba(255,209,102,.25);}
.card.no{opacity:.38;}
.card .ck{position:absolute;top:2px;left:4px;font-size:9px;color:var(--muted);}
.card .ci{font-size:19px;line-height:1.1;}
.card .cn{font-size:11px;font-weight:700;margin-top:1px;}
.card .cc{font-size:9.5px;color:var(--muted);}
.card .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.66);
  height:0;transition:height .12s;pointer-events:none;}
#cardTip{flex:none;padding:8px 12px;font-size:11px;color:var(--muted);
  border-left:1px solid var(--line);width:172px;line-height:1.5;}

/* ============ 遮罩 ============ */
#ov{position:fixed;inset:0;background:rgba(4,8,16,.9);z-index:60;display:none;
  align-items:center;justify-content:center;padding:22px;}
#ov.show{display:flex;}
#ovBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  max-width:860px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 26px;}
#ovBox h2{margin:0 0 6px;font-size:21px;}
#ovBox h3{margin:16px 0 6px;font-size:13px;color:var(--accent);letter-spacing:1px;}
#ovBox p,#ovBox li{font-size:13px;line-height:1.75;color:#c8d6e8;}
#ovBox ul{margin:5px 0;padding-left:20px;}
.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{padding:9px 20px;border-radius:9px;border:1px solid var(--accent);
  background:var(--accent);color:#0b1220;font-weight:700;cursor:pointer;font-size:13px;}
.btn.gh{background:transparent;color:var(--txt);border-color:var(--line);}
.btn:hover{filter:brightness(1.1);}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;}
th{background:#0c1526;color:var(--muted);font-size:11px;}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:8px;}
.kv2 div{background:#0c1526;border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  font-size:12.5px;}
.kv2 b{color:var(--accent);font-size:16px;display:block;}
.rank{font-size:52px;font-weight:900;text-align:center;margin:8px 0;}

/* ============ 改进：速度控制 / 情报 / 强化 / 飘字 ============ */
.tools button.spd{min-width:34px;padding:5px 7px;}
.tools button.spd.on{background:#2bd9c9;border-color:#2bd9c9;color:#04121a;}
.tools button.assist.on{background:#b06bff;border-color:#b06bff;color:#0b1220;}

/* 情报预警面板 */
#intelPanel{position:absolute;top:12px;right:14px;z-index:15;width:236px;
  background:rgba(12,22,40,.94);border:1px solid var(--warn);border-radius:11px;
  padding:9px 11px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:11.5px;
  pointer-events:none;line-height:1.5;display:none;}
#intelPanel.show{display:block;animation:tin .28s;}
#intelPanel .ih{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--warn);
  display:flex;align-items:center;gap:5px;margin-bottom:6px;}
#intelPanel .ih .cnt{margin-left:auto;color:var(--txt);}
.intel-row{display:flex;align-items:center;gap:6px;padding:2.5px 0;
  border-bottom:1px solid rgba(255,255,255,.04);}
.intel-row:last-child{border-bottom:0;}
.intel-row .ii{font-size:14px;width:18px;text-align:center;}
.intel-row .in{font-weight:700;flex:1;}
.intel-row .ic{font-size:10px;color:var(--ok);}
.intel-row .ic.none{color:var(--muted);}
.intel-tip{margin-top:6px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line);
  padding-top:5px;}

/* 飘字 */
.float{position:absolute;z-index:30;pointer-events:none;font-weight:900;font-size:17px;
  text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 2px #000;transform:translate(-50%,-50%);
  animation:fly 1.05s cubic-bezier(.2,.7,.3,1) forwards;white-space:nowrap;}
.float.dmg{color:#ff5c5c;}
.float.score{color:#ffd166;font-size:15px;}
.float.heal{color:#4cd964;}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-30%) scale(.6);}
  15%{opacity:1;transform:translate(-50%,-60%) scale(1.15);}
  100%{opacity:0;transform:translate(-50%,-190%) scale(1);}}

/* 强化三选一 */
.upgrade-card{flex:1;min-width:0;background:var(--panel2);border:2px solid var(--line);
  border-radius:13px;padding:16px 12px 14px;cursor:pointer;text-align:center;
  transition:.16s;position:relative;overflow:hidden;}
.upgrade-card:hover{transform:translateY(-5px);border-color:var(--accent);
  box-shadow:0 10px 30px rgba(0,0,0,.55);}
.upgrade-card .ui{font-size:38px;line-height:1.1;}
.upgrade-card .un{font-size:14px;font-weight:800;margin:8px 0 4px;}
.upgrade-card .ud{font-size:11.5px;color:#b9c9de;line-height:1.55;min-height:36px;}
.upgrade-card .ur{position:absolute;top:8px;right:9px;font-size:9px;font-weight:800;
  padding:2px 7px;border-radius:8px;letter-spacing:.5px;}
.ur.common{background:#1c3055;color:#7fa8d8;}
.ur.rare{background:#3a2560;color:#c98aff;}
.ur.epic{background:#5a3a12;color:#ffcf5c;}
.upgrade-row{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;}
.up-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;}

/* 难度选择 */
.diff-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.diff-card{flex:1;min-width:150px;background:var(--panel2);border:2px solid var(--line);
  border-radius:12px;padding:11px 13px;cursor:pointer;transition:.15s;}
.diff-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.diff-card.on{border-color:var(--accent);background:#22365a;
  box-shadow:0 0 0 2px rgba(255,209,102,.22);}
.diff-card .dn{font-size:14px;font-weight:800;}
.diff-card .dd{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px;}

/* 成就提示 */
#achToast{position:absolute;right:14px;bottom:14px;z-index:70;display:flex;
  flex-direction:column;gap:7px;align-items:flex-end;pointer-events:none;}
.ach{background:linear-gradient(90deg,#2a2410,#3a2c12);border:1px solid var(--accent);
  border-radius:10px;padding:8px 13px;box-shadow:0 8px 24px rgba(0,0,0,.6);
  animation:achin .4s;max-width:260px;}
.ach .at{font-size:10px;color:var(--accent);font-weight:800;letter-spacing:1px;}
.ach .an{font-size:12.5px;font-weight:700;margin-top:2px;}
.ach .ad{font-size:10.5px;color:#cbb98a;margin-top:2px;}
@keyframes achin{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:none;}}

/* HUD 升级徽标 */
.ubadge{display:inline-flex;align-items:center;gap:3px;}
.ubadge .dot{width:7px;height:7px;border-radius:50%;background:#b06bff;
  box-shadow:0 0 6px #b06bff;}

/* 智能助手提示条 */
.assist-tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:16;
  background:rgba(12,22,40,.95);border:1px solid #b06bff;border-radius:20px;
  padding:7px 16px;font-size:11.5px;color:#d9c2ff;pointer-events:none;
  display:none;box-shadow:0 6px 20px rgba(0,0,0,.5);}
.assist-tip.show{display:block;animation:tin .3s;}

/* 提前开战按钮 */
#bStartWave{position:absolute;top:46px;left:14px;z-index:16;display:none;
  background:rgba(18,34,58,.96);border:1px solid var(--warn);color:var(--warn);
  border-radius:18px;padding:5px 13px;font-size:11.5px;font-weight:800;
  cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.45);letter-spacing:.5px;}
#bStartWave:hover{background:var(--warn);color:#0b1220;}
#bStartWave.show{display:block;animation:tin .28s;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🛡 SOC 攻防对抗<span class="sub">企业网络安全防护演练</span></div>
    <div class="hud">
      <div class="chip">波次 <b id="hWave">0/6</b></div>
      <div class="chip hp">完整度 <b id="hHp">120</b>
        <div class="bar"><i id="bHp" style="width:100%"></i></div></div>
      <div class="chip ap">行动点 <b id="hAp">14</b>
        <div class="bar"><i id="bAp" style="width:100%"></i></div></div>
      <div class="chip">得分 <b id="hScore">0</b></div>
      <div class="chip">连击 <b id="hCombo">×1.0</b></div>
      <div class="chip ubadge"><span class="dot"></span>强化 <b id="hUp">0</b></div>
    </div>
    <div class="tools">
      <button class="spd" data-spd="1">1×</button>
      <button class="spd on" data-spd="2">2×</button>
      <button class="spd" data-spd="4">4×</button>
      <button id="bPause">⏸ 暂停</button>
      <button id="bManual">📖 手册</button>
      <button id="bHint" class="on">💡 提示</button>
      <button id="bAuto" class="assist">🩹 智能加固</button>
      <button id="bSfx" class="on">🔊 音效</button>
      <button id="bFs">⛶ 全屏</button>
      <button id="bRestart">🔄 重开</button>
    </div>
  </header>

  <main>
    <div id="stage">
      <svg id="svg" viewBox="0 0 1700 1080" preserveAspectRatio="xMidYMid meet">
        <g id="viewport">
          <g id="zones"></g>
          <g id="edges"></g>
          <g id="atkpaths"></g>
          <g id="nodes"></g>
          <g id="atklayer"></g>
        </g>
      </svg>
      <div id="phaseTag" class="prep">准备中</div>
      <button id="bStartWave">⚔ 提前开战</button>
      <div id="nodePanel"></div>
      <div id="intelPanel"></div>

function cardForVuln(v){
  for(const k in ACTIONS)if(ACTIONS[k].cl.includes(v))return k;
  return null;
}
function autoHarden(){
  if(G.phase!=='prep'&&G.phase!=='wave'){toast('当前阶段无法加固','warn');return;}
  const pool=WAVE_POOL[Math.min(G.wave,WAVE_COUNT-1)]||[];
  const need={};pool.forEach(t=>{const a=ATTACKS[t];if(a.need)need[a.need]=(need[a.need]||0)+2;});
  const cand=[];
  NODES.forEach(n=>{
    if(isExt(n.id))return;
    const s=st[n.id];if(s.comp||s.qUntil>G.t)return;
    s.vulns.forEach(v=>{
      const k=cardForVuln(v);if(!k)return;
      const cost=Math.max(1,ACTIONS[k].cost-G.up.cheapen);
      if(G.ap-cost<2)return;                 // 保留至少 2 AP 应对突发
      cand.push({id:n.id,k,v,cost,
        score:(need[v]||1)*(CORE_CATS.includes(n.cat)?1.7:1)
          +(['db','file','backup','app'].includes(n.id)?1.2:0)});
    });
  });
  cand.sort((a,b)=>b.score-a.score);
  let done=0;
  for(const c of cand){
    if(G.ap-c.cost<2)continue;
    const s=st[c.id];
    if(!s.vulns.includes(c.v))continue;
    G.ap-=c.cost;
    const a=ACTIONS[c.k];
    s.vulns=s.vulns.filter(v=>!a.cl.includes(v));
    score(40);G.stats.hardened++;done++;
    floatTxt('加固 -'+c.cost,'score',c.id);
    if(done>=6)break;
  }
  if(done){sfx(680,.14,'triangle',.05);
    log(`🛠 智能加固：已消除 ${done} 处弱点，耗费 ${cand.slice(0,done).reduce((s,c)=>s+c.cost,0)} AP`,'ok');
    toast(`智能加固完成：${done} 处弱点`,'ok');
    renderDev();renderThreats();
  }else toast('暂无可加固目标或行动点不足','warn');
}
function rollUpgrades(){
  const avail=UPGRADES.filter(u=>G.upLog.filter(x=>x===u.id).length<u.max);

    for(let i=0;i<w;i++)pool.push(u);});
  const out=[];
  while(out.length<3&&pool.length){
    const u=rnd(pool);if(out.some(x=>x.id===u.id))continue;out.push(u);
  }

}

/* ==================== 7. 寻路 ==================== */
function bfs(from,to){
  if(from===to)return[from];
  const q=[[from]],seen=new Set([from]);
  while(q.length){
    const p=q.shift(),cur=p[p.length-1];
    for(const [nb] of (und[cur]||[])){
      if(seen.has(nb)||st[nb].qUntil>G.t)continue;
      const np=p.concat([nb]);
      if(nb===to)return np;
      seen.add(nb);q.push(np);
    }
  }
  return null;
}
const isExt=id=>byId[id].cat==='external';
function nodesWithVuln(tag){
  return NODES.filter(n=>!isExt(n.id)&&st[n.id].vulns.includes(tag)
    &&st[n.id].qUntil<=G.t&&!st[n.id].comp).map(n=>n.id);
}
const empIds=()=>NODES.filter(n=>n.cat==='employee').map(n=>n.id);
const compIds=pool=>NODES.filter(n=>!isExt(n.id)&&st[n.id].comp
  &&(!pool||pool.includes(n.id))).map(n=>n.id);

function pickRoute(type){
  if(type==='lateral'){
    const src=rnd(compIds()); if(!src)return null;
    const nb=(und[src]||[]).map(x=>x[0]).filter(id=>!isExt(id)&&!st[id].comp&&st[id].qUntil<=G.t);
    if(!nb.length)return null;
    return{entry:src,target:rnd(nb)};
  }
  if(type==='exfil'){
    const src=rnd(compIds(['db','file','app','backup'])); if(!src)return null;
    return{entry:src,target:'internet'};
  }
  const M={
    ddos:{e:['internet'],t:['web','proxy','dns','mail']},
    bruteforce:{e:['remote'],t:['vpn','fw_edge','mail']},
    phishing:{e:['remote'],t:empIds()},
    exploit:{e:['internet','partner'],t:nodesWithVuln('patch')},
    sqli:{e:['internet'],t:['db']},
    ransomware:{e:['remote'],t:['file','db','backup']},
    dns:{e:['internet'],t:['dns']},
    zeroday:{e:['internet'],t:['db','app','core_sw','file']},
    insider:{e:empIds(),t:['file','db']},
    supply:{e:['partner'],t:['app','web','db']},
  };
  const m=M[type];
  if(!m)return null;
  const tl=m.t.filter(id=>!st[id].comp&&st[id].qUntil<=G.t);
  if(!tl.length)return null;
  return{entry:rnd(m.e),target:rnd(tl)};
}
function hiddenChance(){
  let p=0.15;
  if(G.wave>=5)p+=0.15;
  if(['ids','siem','soc'].some(id=>st[id].comp))p+=0.35;
  return p;
}
function nodeProgTime(def,id){
  if(isExt(id))return 0.75;
  const s=st[id];
  let t=def.prog*(WAVE_PROG[G.wave-1]||1)*DIFFICULTY[G.diff].prog*(1+G.up.slow);
  if(def.need&&s.vulns.includes(def.need))t*=0.62;
  else if(s.vulns.length===0)t*=1.45;
  if(s.comp)t*=0.6;
  return Math.max(1.2,t);
}

/* ==================== 8. 攻击系统 ==================== */
let atkSeq=0;
function trySpawn(type){
  if(G.attacks.length>=MAX_ALIVE)return 'full';
  const pool=WAVE_POOL[G.wave-1]||['exploit'];
  for(let k=0;k<6;k++){
    const ty=k===0?type:rnd(pool);
    const r=pickRoute(ty);
    if(!r)continue;
    const p=bfs(r.entry,r.target);
    if(!p||p.length<2)continue;
    createAtk(ty,p);
    return 'ok';
  }
  return 'noroute';
}
function createAtk(type,path){
  const def=ATTACKS[type];
  const hidden=Math.random()<hiddenChance();
  const a={id:++atkSeq,type,def,path:path.slice(),hop:0,state:'work',prog:0,
    moveT:0,life:0,hidden,rr:false,pt:nodeProgTime(def,path[0]),target:path[path.length-1],lt:0};
  G.attacks.push(a); mkAtkVis(a);
  if(hidden){
    log('⚠ 检测到异常活动，攻击特征不明……','warn');
    toast('检测到未知威胁，需调查后处置','warn');
  }else{
    log(`${def.i} ${def.n} 自「${byId[path[0]].label}」发起 → 目标「${byId[a.target].label}」`,'bad');
    toast(`${def.i} ${def.n} 来袭！`,'bad');
  }
  sfx(180,.18,'sawtooth',.045);
  renderThreats();
}
function atkAt(id){return G.attacks.filter(a=>a.state==='work'&&a.path[a.hop]===id);}
function rmAtk(a){
  const i=G.attacks.indexOf(a);
  if(i>=0)G.attacks.splice(i,1);
  rmAtkVis(a); renderThreats();
}
function blockAtk(a,why){
  const pt=a.path[a.hop];
  const gain=score(60*(1+G.up.blockScore));
  log(`✅ ${a.hidden?'未知威胁':a.def.n} 被阻断（${why}） +${gain}`,'ok');
  G.combo++;G.stats.blocked++;
  G.hp=Math.min(G.hpMax,G.hp+1);
  floatTxt('阻断 +'+gain,'score',pt);
  sfx(720,.14,'square',.045);
  if(G.stats.blocked===1)unlock('firstBlock');
  if(G.combo>=10)unlock('combo10');
  rmAtk(a);
}
function finishObj(a,cur){
  const nm=byId[cur].label;
  if(a.def.hold){
    st[cur].comp=true;st[cur].nLat=G.t+rR(8,14);st[cur].nEx=G.t+rR(10,16);
    G.stats.comp.add(cur);G.ddosHold=20;G.stats.holds++;
    log(`🌊 ${nm} 被 DDoS 打瘫！持续掉血、行动点回复减半（20s）`,'bad');
    toast(`${nm} 服务不可用！`,'bad');
  }else{
    if(!st[cur].comp){st[cur].comp=true;st[cur].nLat=G.t+rR(8,14);
      st[cur].nEx=G.t+rR(10,16);G.stats.comp.add(cur);}
    log(`🚨 ${a.def.n} 达成目标：${nm}`,'bad');
    if(a.type==='exfil'){G.stats.exfils++;log('📤 核心数据已泄露至外网！','bad');}
    toast(`${a.def.n} 得手：${nm}`,'bad');
  }
  G.combo=0;G.stats.leaks++;sfx(110,.3,'sawtooth',.06);
}
function completeHop(a){
  const cur=a.path[a.hop],last=a.hop===a.path.length-1;
  if(!isExt(cur)){
    let dmg=0;
    if(last)dmg=a.def.dmg;
    else if(a.hop>=2)dmg=a.def.dmg*0.12;
    const take=last||a.def.foothold;
    if(take&&!st[cur].comp){
      st[cur].comp=true;st[cur].nLat=G.t+rR(8,14);st[cur].nEx=G.t+rR(10,16);
      G.stats.comp.add(cur);
      log(`💀 ${byId[cur].label} 已被 ${a.hidden?'未知威胁':a.def.n} 控制`,'bad');
    }
    if(dmg>0){
      damage(dmg);
      log(`💥 ${byId[cur].label} 受损（-${dmg.toFixed(1)} 完整度）`,'bad');
      G.stats.dmg[a.type]=(G.stats.dmg[a.type]||0)+dmg;
    }
  }
  if(last){finishObj(a,cur);rmAtk(a);return;}
  const nx=a.path[a.hop+1];
  if(st[nx].qUntil>G.t)reroute(a);
  else{a.state='move';a.moveT=0;}
}
function reroute(a){
  if(!a.rr){
    a.rr=true;
    const p=bfs(a.path[a.hop],a.target);
    if(p&&p.length>=2){
      a.path=p.slice();a.hop=0;a.state='work';a.prog=0;a.pt=nodeProgTime(a.def,p[0]);
      log(`↩ ${a.hidden?'未知威胁':a.def.n} 绕行新路径（${p.length-1} 跳）`,'warn');
      return;
    }
  }
  a.state='linger';a.lt=5;a.life=Math.min(a.life,25);
  log(`⏸ ${a.hidden?'未知威胁':a.def.n} 无法抵达目标，在边界徘徊`,'warn');
}
function resolveTimeout(a){
  const cur=a.path[a.hop];
  if(!isExt(cur)){
    const d=a.def.dmg*0.3;
    damage(d);
    log(`⌛ ${a.def.n} 活动超时并就地造成破坏（-${d.toFixed(1)}）`,'warn');
  }
}

          <span class="cost">需研判</span></div>`;
        const cost=effCost(rec.k),ok=cost<=G.ap&&ACTIONS[rec.k].cdt<=0;
        return `<div class="npbtn rec ${ok?'':'no'}" data-k="${rec.k}">
          <span class="i">${rec.a.i}</span><div class="nm">${rec.a.n}
          <small>反制 ${rec.name}</small></div><span class="cost">${cost} AP</span></div>`;
      }).join('');
    }
    html+='<div class="npl">🔧 弱点 · 点击加固</div><div style="display:flex;flex-wrap:wrap">';
    html+=s.vulns.length
      ?s.vulns.map(v=>{const k=cardForVuln(v);
        return `<span class="npv" data-k="${k}" title="点击施放 ${ACTIONS[k].n}">${VULN[v]} · ${ACTIONS[k].i}${effCost(k)}</span>`;
      }).join('')
      :'<span class="npv done">已全面加固</span>';
    html+='</div>';
    const defs=Object.keys(ACTIONS).filter(k=>k==='isolate'||validOn(id,k));
    html+='<div class="npl">🛡 可用防御 · 点击施放</div>';
    html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">`;
    html+=defs.map(k=>{
      const a=ACTIONS[k],cost=effCost(k),ok=cost<=G.ap&&a.cdt<=0;
      return `<div class="npbtn ${ok?'':'no'}" data-k="${k}" style="margin:0;padding:4px 6px">
        <span class="i">${a.i}</span><div class="nm">${a.n}<small>${cost}AP${a.cdt>0?' · CD'+a.cdt.toFixed(1):''}</small></div></div>`;
    }).join('')+'</div>';
  }
  p.innerHTML=html;p.classList.add('show');placeNodePanel();
}
$('#nodePanel').addEventListener('click',e=>{
  if(e.target.closest('[data-npclose]')){hideNodePanel();return;}
  const b=e.target.closest('[data-k]');if(!b||b.classList.contains('no')||!npOpen)return;

});
function validOn(id,k){
  if(isExt(id))return false;
  if(k==='isolate')return true;
  const a=ACTIONS[k];
  if(atkAt(id).some(x=>x.hidden?k==='hunt':x.def.ct.includes(k)))return true;
  if(a.cl.some(v=>st[id].vulns.includes(v)))return true;
  return false;
}
function applyCard(id,k,costExtra=0){
  const n=byId[id],a=ACTIONS[k];
  if(G.phase!=='wave'&&G.phase!=='prep')return;
  if(isExt(id)){toast('外部网络节点无法直接处置','warn');return;}
  if(a.cdt>0){toast(`${a.n} 冷却中（${a.cdt.toFixed(1)}s）`,'warn');return;}
  const discount=(k==='isolate'||k==='restore')?0:G.up.cheapen;
  const cost=Math.max(1,a.cost+costExtra-discount);
  if(G.ap<cost){toast(`行动点不足（需 ${cost}）`,'warn');sfx(140,.1,'square',.03);return;}

  if(k==='isolate'){
    const atks=atkAt(id);
    atks.forEach(x=>{score(60);G.combo++;G.stats.blocked++;
      log(`✅ ${x.hidden?'未知威胁':x.def.n} 因主机隔离而中断 +60`,'ok');rmAtk(x);});
    st[id].comp=false;st[id].qUntil=G.t+12000;
    G.stats.isolates++;
    const core=CORE_CATS.includes(n.cat);
    const d=core?5:1;
    damage(d);
    log(`🧯 已隔离 ${n.label}（离线 12s${core?'，业务中断 -5':''}）`,core?'warn':'ok');
    G.ap-=cost;a.cdt=a.cd;sfx(520,.12,'triangle',.05);
    return;
  }

  let eff=false;
  // 反制攻击
  const hits=atkAt(id).filter(x=>x.hidden?k==='hunt':x.def.ct.includes(k));
  if(hits.length){
    hits.forEach(x=>{
      if(x.hidden){x.hidden=false;log(`🔎 已识别未知威胁：${x.def.n}`,'ok');sfx(660,.12,'sine',.05);}
      blockAtk(x,`${a.n} 反制成功`);
    });
    eff=true;
  }
  // 清除弱点
  const cl=a.cl.filter(v=>st[id].vulns.includes(v));
  if(cl.length){
    st[id].vulns=st[id].vulns.filter(v=>!a.cl.includes(v));
    score(40*cl.length);G.stats.hardened+=cl.length;
    log(`🛡 加固 ${n.label}：已消除 ${cl.map(v=>VULN[v]).join('、')} +${40*cl.length}`,'ok');
    eff=true;
  }
  // 净化失陷
  if(eff&&st[id].comp&&(k==='edr'||k==='restore'||k==='hunt'||k==='patch')){
    st[id].comp=false;G.stats.comp.delete(id);
    score(30);log(`✨ ${n.label} 已净化，恢复正常运行`,'ok');
  }
  if(eff){
    G.ap-=cost;a.cdt=a.cd;
    if(G.ddosHold>0&&k==='ddos_clean'){G.ddosHold=0;log('🌊 DDoS 占用已解除，带宽恢复','ok');}
    sfx(680,.12,'triangle',.05);
  }else{
    G.stats.inv++;
    toast(`「${a.n}」对 ${n.label} 无效 —— 未消耗行动点`,'warn');
    sfx(150,.09,'square',.025);
  }
}
function setArmed(k){
  G.armed=k;

/* ==================== 10. 波次 ==================== */
function startGame(){
  const D=DIFFICULTY[G.diff]||DIFFICULTY.normal;
  Object.assign(G,{t:0,wave:0,hp:D.hp,hpMax:D.hp,ap:D.ap,apMax:D.ap,score:0,combo:0,
    attacks:[],queue:[],ddosHold:0,paused:false,sel:null,auto:false,
    up:freshUp(),upLog:[]});
  G.stats={comp:new Set(),dmg:{},leaks:0,holds:0,exfils:0,blocked:0,hardened:0,isolates:0,inv:0};
  NODES.forEach(n=>{const s=st[n.id];
    s.vulns=(VULNS[n.id]||[]).slice();s.comp=false;s.qUntil=0;s.nLat=0;s.latWave=0;s.nEx=0;s.exWave=0;});
  Object.keys(ACTIONS).forEach(k=>ACTIONS[k].cdt=0);
  G.attacks.slice().forEach(rmAtk);
  $('#log').innerHTML='';$('#achToast').innerHTML='';
  lastFlash=-9999;lastFloat={};hideNodePanel();
  setArmed(null);setSpeed(G.speed,true);$('#bAuto').classList.remove('on');
  lastIntelKey='';
  G.paused=false;updatePauseBtn();
  G.phase='prep';G.prepT=30;
  log(`🔧 ${D.n}难度 · 战前准备：给关键设备加固弱点，30 秒后第一波攻击到来`,'ok');
  SAVE.plays++;persist();
  hideOv();renderIntel();
}
function startWave(){
  G.wave++;G.phase='wave';G.waveT=0;G.ap=G.apMax;
  const pool=WAVE_POOL[G.wave-1];
  const D=DIFFICULTY[G.diff];
  const n=Math.max(3,Math.round(WAVE_ATK[G.wave-1]*D.atk));
  const iv=Math.max(1.8,6.0-0.6*G.wave)/Math.sqrt(D.atk);
  G.queue=[];
  for(let i=0;i<n;i++)G.queue.push({t:i*iv+Math.random()*iv*0.4,type:rnd(pool)});
  if(G.up.autoClean>0){
    const lost=NODES.filter(x=>st[x.id].comp&&!isExt(x.id)).map(x=>x.id);
    for(let i=0;i<G.up.autoClean&&lost.length;i++){
      const id=lost.splice(Math.floor(Math.random()*lost.length),1)[0];
      st[id].comp=false;G.stats.comp.delete(id);
      floatTxt('自动净化','heal',id);
      log(`🧹 自动编排：${byId[id].label} 已净化`,'ok');
    }
  }
  log(`⚔ 第 ${G.wave} 波攻击开始（${n} 项威胁）`,'bad');
  toast(`第 ${G.wave} 波攻击开始！`,'bad');
  sfx(220,.3,'sawtooth',.055);renderIntel();
}
function endWave(){
  const c=NODES.filter(x=>st[x.id].comp).length;
  const heal=10+G.up.heal;
  G.hp=Math.min(G.hpMax,G.hp+heal);score(200);
  log(`✅ 第 ${G.wave} 波防御成功（+${heal} 完整度，+200 分）`,'ok');
  floatTxt('+'+heal,'heal');
  if(c===0)unlock('flawless');
  const pen=Math.min(c*2,14);
  if(pen>0){damage(pen);log(`⚠ 波次结算：${c} 台设备仍失陷（-${pen} 完整度）`,'warn');}
  if(G.phase==='over')return;          // 结算扣血已导致失败，不再判定胜利
  if(G.wave>=WAVE_COUNT){gameOver(true);return;}
  showUpgrade();                        // 内部设置准备阶段，玩家选完强化才继续
  log('🔧 进入准备阶段（25s），可随时提前开始下一波','ok');
}
function gameOver(win){
  G.phase='over';hideNodePanel();G.attacks.slice().forEach(rmAtk);G.queue=[];
  setArmed(null);
  showResult(win);
}

/* ==================== 11. 主循环 ==================== */
function update(dt){
  const regen=(G.phase==='prep'?0.9:0.68)*(1+G.up.regen)*(G.ddosHold>0?0.5:1);
  G.ap=Math.min(G.apMax,G.ap+regen*dt);
  for(const k in ACTIONS)if(ACTIONS[k].cdt>0)ACTIONS[k].cdt=Math.max(0,ACTIONS[k].cdt-dt);
  if(G.ddosHold>0){G.ddosHold-=dt;damage(0.4*dt);}

  if(G.phase==='prep'){
    G.prepT-=dt;
    if(G.prepT<=0)startWave();
  }
  if(G.phase==='wave'){
    G.waveT+=dt;
    while(G.queue.length&&G.queue[0].t<=G.waveT){
      const it=G.queue.shift();
      const r=trySpawn(it.type);
      if(r==='full'){G.queue.unshift(it);break;}
      if(r==='noroute'){score(50);log('🛡 攻击未能找到可达路径，防御体系生效 +50','ok');}
    }
    // 失陷节点自发展开
    NODES.forEach(n=>{
      const s=st[n.id];
      if(!s.comp)return;
      if(s.latWave!==G.wave&&G.t>=s.nLat){
        s.latWave=G.wave;
        if(Math.random()<0.65)trySpawn('lateral'); else s.nLat=G.t+8000;
      }
      if(G.wave>=3&&['db','file','app','backup'].includes(n.id)
        &&s.exWave!==G.wave&&G.t>=s.nEx){
        s.exWave=G.wave;
        if(Math.random()<0.6)trySpawn('exfil'); else s.nEx=G.t+10000;
      }
    });
    if(!G.queue.length&&!G.attacks.length)endWave();
  }

  for(let i=G.attacks.length-1;i>=0;i--){
    if(G.phase==='over')break;
    const a=G.attacks[i];
    if(!a)break;            // 数组已在遍历中缩短（如 gameOver 清空），立即停止
    a.life+=dt;
    if(a.life>ATK_LIFE){resolveTimeout(a);rmAtk(a);continue;}
    if(a.state==='work'){
      const cur=a.path[a.hop];
      if(st[cur].qUntil>G.t){blockAtk(a,'主机已被隔离');continue;}
      a.prog+=dt/a.pt;
      if(a.prog>=1)completeHop(a);
    }else if(a.state==='move'){
      a.moveT+=dt/0.55;
      if(a.moveT>=1){
        a.hop++;a.state='work';a.prog=0;
        const nx=a.path[a.hop];
        if(st[nx].qUntil>G.t)reroute(a);
        else a.pt=nodeProgTime(a.def,nx);
      }
    }else if(a.state==='linger'){
      a.lt-=dt;damage(0.3*dt);
      if(a.lt<=0){
        const p=bfs(a.path[a.hop],a.target);
        if(p&&p.length>=2){
          a.path=p.slice();a.hop=0;a.state='work';a.prog=0;
          a.pt=nodeProgTime(a.def,p[0]);a.life=Math.min(a.life,30);
          log(`🔁 ${a.def.n} 重新找到路径，继续渗透`,'warn');
        }else a.lt=5;
      }
    }
  }
}

    else if(s.comp){fill='#3a1220';stroke='#ff4d6d';sw=3;badge='💀';}
    else{const a=atkAt(n.id)[0];
      if(a){stroke=a.hidden?'#ff9f43':a.def.c;sw=3.2;badge=a.hidden?'❓':'⚠';}}
    if(!s.comp&&s.qUntil<=G.t&&s.vulns.length===0&&!atkAt(n.id).length)badge=badge||'🛡';
    v.box.setAttribute('fill',fill);
    v.box.setAttribute('stroke',stroke);
    v.box.setAttribute('stroke-width',sw);
    v.bd.textContent=badge;

    const a=atkAt(n.id)[0];
    if(a){
      v.pg.setAttribute('display','');
      v.pf.setAttribute('width',152*Math.min(1,a.prog));
      v.pf.setAttribute('fill',a.hidden?'#ff9f43':a.def.c);
    }else v.pg.setAttribute('display','none');

    // 弱点点
    const want=s.vulns.length;
    if(v.vg.childNodes.length!==want){
      v.vg.textContent='';
      s.vulns.forEach((_,i)=>v.vg.appendChild(
        el('circle',{cx:-76+i*11,cy:26,r:3.2,fill:'#ff9f43',opacity:.85})));
    }
    v.vg.setAttribute('display',a?'none':'');
  });

  // 攻击可视化
  G.attacks.forEach(a=>{

    let x,y;
    if(a.state==='move'){
      const p1=pos[a.path[a.hop]],p2=pos[a.path[a.hop+1]],t=a.moveT;
      x=p1.x+(p2.x-p1.x)*t; y=p1.y+(p2.y-p1.y)*t;
    }else{const p=pos[a.path[a.hop]];x=p.x;y=p.y-4;}
    v.halo.setAttribute('cx',x);v.halo.setAttribute('cy',y);
    v.dot.setAttribute('cx',x);v.dot.setAttribute('cy',y);
    v.txt.setAttribute('x',x);v.txt.setAttribute('y',y-23);
    v.txt.textContent=a.hidden?'❓ 未知':a.def.i+' '+a.def.n;
    if(a.hidden){
      v.pth.setAttribute('display','none');
      v.dot.setAttribute('fill','#ff9f43');
    }else{
      v.pth.setAttribute('display','');
      v.dot.setAttribute('fill',a.def.c);
      let d='';
      for(let i=a.hop;i<a.path.length;i++){
        const p=pos[a.path[i]];
        d+=(i===a.hop?'M':'L')+p.x+','+p.y+' ';
      }
      v.pth.setAttribute('d',d);
    }
    v.pth.setAttribute('stroke',a.def.c);

  if(npOpen){
    const sig=nodeSig();
    if(sig!==npSig){npSig=sig;renderNodePanel();}
    else placeNodePanel();
  }
}
function updateCards(){
  document.querySelectorAll('.card').forEach(c=>{
    const a=ACTIONS[c.dataset.k];
    c.classList.toggle('no',G.ap<a.cost||a.cdt>0);
    c.querySelector('.cd').style.height=(a.cdt>0?a.cdt/a.cd*100:0)+'%';

}
function renderThreats(){
  const box=$('#threats');
  $('#thN').textContent=G.attacks.length;
  if(!G.attacks.length){box.innerHTML='<div class="empty">暂无活跃威胁</div>';return;}
  box.innerHTML='';
  G.attacks.forEach(a=>{

      actHtml=`<button class="th-act" data-act="hunt">🔎<b>调查 1</b></button>`;
    }else if(rec){
      const fee=G.up.noFee?0:1;

      actHtml=`<button class="th-act" data-act="${rec.k}">${rec.a.i}<b>${Math.max(1,rec.a.cost+fee-dk)} AP</b></button>`;

      <div class="th-ic">${showIcon}</div>
      <div class="th-main">
        <div class="th-t">${showName} <span class="ar">→</span> ${byId[cur].label}

  return null;
}

let locateT=0;

/* ==================== 13. 提示 / 卡片 ==================== */
function showTip(n,e){
  const s=st[n.id];
  const q=s.qUntil>G.t;
  const vs=s.vulns.length?s.vulns.map(v=>VULN[v]).join('、'):'已全面加固';
  let stx=q?'🔒 已隔离':(s.comp?'💀 已失陷':'✅ 正常');
  const atk=atkAt(n.id);
  const atx=atk.length?`<div style="margin-top:3px">⚠ 正遭受：${atk.map(a=>a.hidden?'未知威胁':a.def.n).join('、')}</div>`:'';
  $('#tip').innerHTML=`<div class="t">${n.icon} ${n.label}</div>
    <div style="color:var(--muted)">${CAT[n.cat]} · ${n.ip}</div>
    <div>状态：${stx}</div><div>弱点：${vs}</div>${atx}`;
  $('#tip').style.display='block';moveTip(e);
}
function moveTip(e){
  const t=$('#tip'),r=$('#stage').getBoundingClientRect();
  let x=e.clientX-r.left+16,y=e.clientY-r.top+14;
  if(x+t.offsetWidth>r.width-8)x=e.clientX-r.left-t.offsetWidth-14;
  if(y+t.offsetHeight>r.height-8)y=e.clientY-r.top-t.offsetHeight-12;
  t.style.left=x+'px';t.style.top=y+'px';
}
function hideTip(){$('#tip').style.display='none';}

function buildCards(){
  const box=$('#cards');
  box.innerHTML='';
  Object.entries(ACTIONS).forEach(([k,a])=>{
    const c=document.createElement('div');
    c.className='card';c.dataset.k=k;
    c.innerHTML=`<div class="cd"></div><div class="ck">${a.k}</div>
      <div class="ci">${a.i}</div><div class="cn">${a.n}</div>
      <div class="cc">${a.cost} AP${a.cd>1?' · CD'+a.cd+'s':''}</div>`;
    c.addEventListener('click',()=>{
      if(G.sel&&!isExt(G.sel)&&(G.phase==='wave'||G.phase==='prep')&&validOn(G.sel,k)){
        applyCard(G.sel,k);renderDev();    // 已选节点 → 直接施放，免去往返
        if(npOpen){npSig='';renderNodePanel();}
      }else setArmed(G.armed===k?null:k);
    });
    c.addEventListener('mouseenter',()=>{$('#cardTip').textContent=a.d;});
    box.appendChild(c);
  });
}

/* ==================== 14. 遮罩 ==================== */
function showOv(html){$('#ovBox').innerHTML=html;$('#ov').classList.add('show');}
function hideOv(){$('#ov').classList.remove('show');}
function showStart(){
  const diffHtml=Object.entries(DIFFICULTY).map(([k,d])=>`
    <div class="diff-card ${k===G.diff?'on':''}" data-diff="${k}">
      <div class="dn">${d.n}</div><div class="dd">${d.desc}</div>
    </div>`).join('');
  showOv(`<h2>🛡 SOC 攻防对抗演练</h2>
  <p>你是一家企业的<b>安全管理员</b>。黑客正沿网络拓扑从外网逐跳渗透，目标是数据库、文件服务器等核心资产。</p>
  <h3>选择难度</h3>
  <div class="diff-row">${diffHtml}</div>
  <h3>怎么玩</h3>
  <ul>
    <li><b>备战阶段</b>：右上角<b>情报预警</b>透露下一波攻击类型；点 <b>🩹 智能加固</b> 可一键消除最关键弱点。</li>
    <li>备战完毕点 <b>⚔ 提前开战</b> 直接进入交战，不必干等计时；也可用 <b>1×/2×/4×</b> 调节节奏。</li>
    <li>点任意节点会在它<b>旁边弹出快捷面板</b>：弱点、当前威胁、可用防御都在一起，点一下就施放。右侧弱点标签和底部卡牌也可直接点击施放到已选节点。</li>
    <li>选中<b>防御卡</b>（或按数字键）再点节点，可对多个节点连续施放同一张卡。</li>
    <li><b>每波守住后三选一强化</b>，本局永久生效——这是逆风翻盘的关键。</li>
    <li>前两跳为侦察期几乎不掉血，但勒索 / 0day / 供应链会<b>沿途建立据点</b>，必须尽早拦截。</li>
    <li>失陷设备会<b>横向移动</b>，数据库 / 文件服务器失陷后还会<b>数据外泄</b>。</li>
  </ul>
  <h3>注意</h3>
  <ul>
    <li>完整度归零即失败，扛过 6 波即胜利。IDS / SIEM / SOC 失陷会让攻击类型不明，需花 1 AP 调查。</li>
    <li>隔离主机是万能阻断，但核心设备隔离会造成业务中断掉血。</li>
  </ul>
  <div style="margin-top:12px;font-size:11.5px;color:var(--muted)">
    🏆 历史最高 <b style="color:var(--accent)">${SAVE.best}</b> 分 · 通关 ${SAVE.wins} 次 ·
    成就 ${SAVE.ach.length}/${Object.keys(ACHIEVEMENTS).length}
  </div>
  <div class="btnrow">
    <button class="btn" onclick="startGame()">开始演练</button>
    <button class="btn gh" onclick="showManual()">📖 攻防手册</button>
  </div>`);
  document.querySelectorAll('.diff-card').forEach(c=>c.onclick=()=>{
    G.diff=c.dataset.diff;SAVE.diff=G.diff;persist();
    document.querySelectorAll('.diff-card').forEach(x=>x.classList.toggle('on',x===c));
    sfx(560,.08,'sine',.03);
  });
}
function showManual(){
  const atkRows=Object.entries(ATTACKS).map(([k,a])=>
    `<tr><td>${a.i} ${a.n}</td><td>${a.need?VULN[a.need]:'—'}</td>
     <td>${a.hold?'持续占用':a.dmg}</td><td>${a.foothold?'<b>是</b>':'否'}</td>
     <td>${a.ct.map(c=>ACTIONS[c].i+ACTIONS[c].n).join('、')}</td>
     <td style="font-size:11px;color:#8098b8">${a.d}</td></tr>`).join('');
  const actRows=Object.entries(ACTIONS).map(([k,a])=>
    `<tr><td>${a.i} ${a.n}</td><td>${a.cost}</td>
     <td>${a.cl.length?a.cl.map(v=>VULN[v]).join('、'):'<span style="color:#8098b8">万能</span>'}</td>
     <td>${a.d}</td></tr>`).join('');
  showOv(`<h2>📖 攻防手册</h2>
  <h3>攻击方式 → 有效反制</h3>
  <table><tr><th>攻击</th><th>利用弱点</th><th>终点伤害</th><th>沿途失陷</th><th>有效反制</th><th>说明</th></tr>
  ${atkRows}</table>
  <h3>防御手段</h3>
  <table><tr><th>手段</th><th>消耗</th><th>可清除弱点</th><th>说明</th></tr>${actRows}</table>
  <h3>伤害模型</h3>
  <p>第 1–2 跳为<b>侦察期，零伤害</b>；第 3 跳起每跳仅 0.12 倍伤害；<b>终点造成全额伤害</b>。
  因此不必对每一起攻击都立刻响应——优先处理会沿途建立据点的类型。</p>
  <div class="btnrow"><button class="btn" onclick="closeManual()">返回</button></div>`);
}
function closeManual(){ backOv(); }
function showResult(win){
  if(win){
    SAVE.wins++;
    if(G.stats.exfils===0)unlock('noLeak');
    if(G.diff==='hard'||G.diff==='insane')unlock('hardcore');
    if(G.hp<20)unlock('survivor');
  }
  if(SAVE.best<G.score)SAVE.best=G.score;
  if(G.score>=8000)unlock('rich');
  if(G.stats.hardened>=30)unlock('collector');
  persist();
  const s=G.stats;
  const dmgEnt=Object.entries(s.dmg).sort((a,b)=>b[1]-a[1]);
  const worst=dmgEnt.length?`${ATTACKS[dmgEnt[0][0]].i} ${ATTACKS[dmgEnt[0][0]].n}（${dmgEnt[0][1].toFixed(1)} 伤害）`:'无';
  const safe=NODES.filter(n=>!s.comp.has(n.id)&&!isExt(n.id)).length;
  const tot=NODES.filter(n=>!isExt(n.id)).length;
  let rank='D',rc='#ff4d6d';
  if(win){
    if(G.score>=8000){rank='S';rc='#ffd166';}
    else if(G.score>=5500){rank='A';rc='#4cd964';}
    else if(G.score>=3500){rank='B';rc='#2bd9c9';}
    else if(G.score>=1800){rank='C';rc='#4aa3ff';}
    else{rank='D';rc='#ff4d6d';}
  }else{rank='F';rc='#ff4d6d';}
  const rec=dmgEnt.slice(0,3).map(([k])=>{
    const a=ATTACKS[k];
    return `${a.ct.map(c=>ACTIONS[c].n).join('/')}（防 ${a.n}）`;
  }).join('　→　')||'—';
  showOv(`<h2>${win?'🎉 演练成功':'💀 防线失守'}</h2>
  <p>${win?`你成功扛过了全部 ${WAVE_COUNT} 波攻击。`:`企业完整度归零，防线在第 ${G.wave} 波被击穿。`}</p>
  <div class="rank" style="color:${rc}">${rank}</div>
  <div class="kv2">
    <div><b>${G.score}</b>总得分</div>
    <div><b>${Math.ceil(G.hp)}</b>剩余完整度</div>
    <div><b>${s.blocked}</b>成功阻断攻击数</div>
    <div><b>${s.hardened}</b>消除弱点数</div>
    <div><b>${safe}/${tot}</b>从未失陷的设备</div>
    <div><b>${s.leaks}</b>攻击得手次数</div>
    <div><b>${s.holds}</b>DDoS 占用次数</div>
    <div><b>${s.exfils}</b>数据外泄成功次数</div>
    <div><b>${s.isolates}</b>隔离处置次数</div>
    <div><b>${s.inv}</b>无效处置次数</div>
    <div><b>${SAVE.best}</b>历史最高分</div>
    <div><b>${SAVE.ach.length}/${Object.keys(ACHIEVEMENTS).length}</b>成就进度</div>
  </div>
  <h3>最致命的攻击类型</h3><p>${worst}</p>
  <h3>建议优先加固</h3><p>${rec}</p>
  <h3>本局强化</h3><p style="color:#d9c2ff">${G.upLog.length
    ?G.upLog.map(id=>{const u=UPGRADES.find(x=>x.id===id);return u?u.i+' '+u.n:'';}).join('　')
    :'无 —— 每波守住后别忘了选择强化'}</p>
  <div class="btnrow">
    <button class="btn" onclick="startGame()">再来一次</button>
    <button class="btn gh" onclick="showManual()">📖 查看手册</button>
  </div>`);
  sfx(win?880:120,.5,win?'triangle':'sawtooth',.06);
}

/* ==================== 15. 缩放平移 ==================== */
const svg=$('#svg'),vp=$('#viewport');
let sc=1,tx=0,ty=0;
const applyT=()=>vp.setAttribute('transform',`translate(${tx},${ty}) scale(${sc})`);
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const mx=(e.clientX-r.left)/r.width*1700,my=(e.clientY-r.top)/r.height*1080;
  const f=e.deltaY<0?1.13:1/1.13;
  const ns=Math.min(3,Math.max(.45,sc*f));
  tx=mx-(mx-tx)*(ns/sc);ty=my-(my-ty)*(ns/sc);sc=ns;applyT();
},{passive:false});
let drag=false,sx,sy,moved=0;
svg.addEventListener('mousedown',e=>{drag=true;moved=0;sx=e.clientX-tx;sy=e.clientY-ty;
  svg.classList.add('grabbing');hideTip();});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const nx=e.clientX-sx,ny=e.clientY-sy;
  moved+=Math.abs(nx-tx)+Math.abs(ny-ty);tx=nx;ty=ny;applyT();
});
window.addEventListener('mouseup',()=>{drag=false;svg.classList.remove('grabbing');});
svg.addEventListener('click',e=>{
  if(moved>6)return;
  if(G.armed)setArmed(null);else if(npOpen)hideNodePanel();
});
$('#bFs').onclick=()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};

/* ==================== 16. 控制 ==================== */
function updatePauseBtn(){
  $('#bPause').textContent=G.paused?'▶ 继续':'⏸ 暂停';
  $('#bPause').classList.toggle('on',G.paused);
}
function showPauseOv(){
  showOv(`<h2>⏸ 已暂停</h2>
    <p>第 ${G.wave} 波 · 完整度 ${Math.ceil(G.hp)} · 得分 ${G.score}</p>
    <div class="btnrow">
      <button class="btn" onclick="togglePause()">继续</button>
      <button class="btn gh" onclick="showManual()">📖 攻防手册</button>
      <button class="btn gh" onclick="askRestart()">重新开始</button>
    </div>`);
}
let wasPaused=false;                       // 打开临时弹窗前的暂停状态，用于返回时还原
function togglePause(){
  if(G.phase==='menu'||G.phase==='over')return;
  if(G.paused&&G.phase==='wave'&&!G.queue.length&&!G.attacks.length
    &&document.querySelector('.upgrade-card'))return;   // 强化选择中，必须先做选择
  G.paused=!G.paused;updatePauseBtn();
  if(G.paused)showPauseOv();else hideOv();
}
// 返回上一层：恢复进入弹窗前的暂停状态，避免游戏卡在暂停且无恢复入口
function backOv(){
  if(G.phase==='menu'){showStart();return;}
  G.paused=wasPaused;updatePauseBtn();
  if(wasPaused)showPauseOv();else hideOv();
}
function askRestart(){
  if(G.phase!=='menu'&&G.phase!=='over'){G.paused=true;updatePauseBtn();}
  showOv(`<h2>重新开始？</h2><p>当前进度将丢失。</p>
    <div class="btnrow"><button class="btn" onclick="startGame()">确认重开</button>
    <button class="btn gh" onclick="backOv()">取消</button></div>`);
}
$('#bPause').onclick=togglePause;
$('#bManual').onclick=()=>{
  wasPaused=G.paused;
  if(G.phase!=='menu'&&G.phase!=='over'){G.paused=true;updatePauseBtn();}
  showManual();
};
function setSpeed(s,silent){
  G.speed=s;
  document.querySelectorAll('.spd').forEach(b=>b.classList.toggle('on',+b.dataset.spd===s));
  if(silent)return;
  const tip=$('#assistTip');
  tip.textContent=`⏩ 游戏速度已切换为 ${s}×`;
  tip.classList.add('show');
  clearTimeout(setSpeed._t);
  setSpeed._t=setTimeout(()=>tip.classList.remove('show'),1600);
}
document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{
  setSpeed(+b.dataset.spd);sfx(520,.07,'sine',.03);
});
$('#bAuto').onclick=()=>{
  if(G.phase==='menu'||G.phase==='over'){toast('请先开始演练','warn');return;}
  autoHarden();
};
$('#bStartWave').onclick=()=>{
  if(G.phase!=='prep')return;
  startWave();sfx(220,.26,'sawtooth',.05);
};
$('#bHint').onclick=function(){G.hint=!G.hint;this.classList.toggle('on',G.hint);renderThreats();};
$('#bSfx').onclick=function(){G.sfx=!G.sfx;this.classList.toggle('on',G.sfx);};
$('#bRestart').onclick=askRestart;
window.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();togglePause();return;}
  if(e.key==='Escape'){setArmed(null);if($('#ov').classList.contains('show')
    &&G.phase!=='menu'&&G.phase!=='over'&&!G.paused)hideOv();return;}
  if(G.phase==='menu'||G.phase==='over')return;
  const ak=Object.keys(ACTIONS).find(k=>ACTIONS[k].k===e.key);
  if(ak){setArmed(G.armed===ak?null:ak);return;}
  if(e.key.toLowerCase()==='h'){showManual();}
  if(e.key==='Tab'){
    e.preventDefault();
    if(G.attacks.length){
      const i=(G.attacks.findIndex(a=>a.path[a.hop]===G.sel)+1)%G.attacks.length;
      locate(G.attacks[i].path[G.attacks[i].hop]);
    }
  }
});

/* ==================== 17. 启动 ==================== */
buildCards();renderThreats();renderDev();
G.diff=SAVE.diff;showStart();setSpeed(G.speed,true);
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min(60,now-last);last=now;
  if(!G.paused&&G.phase!=='menu'&&G.phase!=='over'){
    const step=raw*G.speed;
    G.t+=step;update(step/1000);
    if(G.armed)updateArmHints();
  }
  render();
}
requestAnimationFrame(frame);
</script>
